[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cta-qsar"
version = "0.1.0"
description = "Chemically Trustworthy Agentic QSAR: an autonomous, modular QSAR scientist agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CTA-QSAR" }]
keywords = ["qsar", "cheminformatics", "machine-learning", "agent", "langgraph", "rdkit"]
dependencies = [
    "pydantic>=2.5",
    "langgraph>=0.2.60",
    "rdkit>=2023.9",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "xgboost>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "mlflow>=2.10",
]

[project.optional-dependencies]
gpu = ["torch>=2.1"]
ml = ["lightgbm>=4.0", "mordred>=1.2", "shap>=0.44", "autogluon>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "ruff>=0.4", "build>=1.0", "twine>=5.0", "pip-audit>=2.7", "pre-commit>=3.6"]

[project.scripts]
cta-qsar = "cta_qsar.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: full-workflow tests that run the LangGraph engine (CPU-only)",
]
filterwarnings = [
    "ignore::UserWarning:langchain_core.*",
]

[tool.coverage.run]
source = ["cta_qsar"]
branch = true

[tool.coverage.report]
fail_under = 60
skip_covered = true
show_missing = true
omit = ["*/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501", "B008", "N803", "N806", "N812"]