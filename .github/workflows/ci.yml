name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_CACHE_DIR: "${{ github.workspace }}/.pip-cache"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: pip install 'ruff>=0.4'
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev extras
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + integration tests with coverage
        run: pytest --cov=cta_qsar --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  smoke:
    name: CLI smoke run (mock LLM)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Build a tiny dataset
        run: |
          printf 'smiles,activity\nCC(=O)Oc1ccccc1C(=O)O,-2.1\nc1ccccc1,-0.4\nCCO,0.5\nCCN,0.6\nCCC,0.7\nCC(=O)N,0.3\nc1ccc(O)cc1,-1.2\nClC(Cl)Cl,-1.9\n' > /tmp/tiny.csv
      - name: Run the full workflow on it
        env:
          LLM_PROVIDER: mock
        run: |
          cta-qsar run \
            --data /tmp/tiny.csv \
            --smiles-column smiles \
            --target-column activity \
            --llm-provider mock \
            --budget 1 \
            --max-minutes 3 \
            --output runs
      - name: Assert artifacts exist
        run: |
          test -f runs/*/report.json
          test -f runs/*/report.md
          test -f runs/*/provenance.json
          echo "smoke run OK"

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    needs: [lint]
    continue-on-error: true  # advisory DB drift must not wedge the pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + audit tool
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" pip-audit
      - name: Audit the dependency tree
        run: pip-audit --local

  build:
    name: Build & verify sdist/wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install --upgrade pip build twine
      - name: Build distributions
        run: |
          python -m build
          twine check dist/*
      - name: Verify wheel imports in a clean virtualenv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/cta-qsar list-providers
          /tmp/venv/bin/python -c "import cta_qsar; print('import OK', cta_qsar.__file__)"
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/